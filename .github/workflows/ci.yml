name: Supabase CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno check --config=supabase/functions/heritier-api/deno.json supabase/functions/heritier-api/index.ts

  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure migrations are versioned
        run: test -n "$(find supabase/migrations -maxdepth 1 -name '*.sql' -print -quit)"
