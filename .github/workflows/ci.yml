name: Supabase CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Security and receipt regression tests
        run: deno test --allow-env --allow-read --allow-write --config=supabase/functions/heritier-api/deno.json supabase/tests/
      - name: Type check
        run: deno check --config=supabase/functions/heritier-api/deno.json supabase/functions/heritier-api/index.ts

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heritier_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply schema and test concurrent handlers
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heritier_security_test
        run: deno test --allow-env --allow-read --allow-net=127.0.0.1:5432 --config=supabase/functions/heritier-api/deno.json supabase/tests/postgres-integration.ts
